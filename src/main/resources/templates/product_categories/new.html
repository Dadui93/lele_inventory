<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>New Product Category</title>
  <link rel="stylesheet" th:href="@{/style.css}"/>
</head>
<body>
<div class="nav">
  <a th:href="@{/}">主页</a>
  <a th:href="@{/product-categories}">返回列表</a>
</div>

<h2>新增品类</h2>
<form th:action="@{/product-categories}" method="post">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <div>
    <label>品类编码：</label>
    <input type="text" name="productCategoryId" required/>
  </div>
  <div style="margin-top:10px;">
    <label>品类名称：</label>
    <input type="text" name="productCategoryName" required/>
  </div>
  <div style="margin-top:12px;">
    <button type="submit">保存</button>
  </div>
</form>
</body>
</html>
