<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>New Product</title>
  <link rel="stylesheet" th:href="@{/style.css}"/>
</head>
<body>
<div class="nav">
  <a th:href="@{/}">主页</a>
  <a th:href="@{/products}">返回列表</a>
</div>

<h2>新增商品</h2>
<form th:action="@{/products}" method="post">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

  <div>
    <label>商品编码：</label>
    <input type="text" name="productId" required/>
  </div>
  <div style="margin-top:10px;">
    <label>商品名称：</label>
    <input type="text" name="productName" required/>
  </div>
  <div style="margin-top:10px;">
    <label>厂商名称：</label>
    <input type="text" name="manufacturingName"/>
  </div>
  <div style="margin-top:10px;">
    <label>品类：</label>
    <select name="productCategoryId" required>
      <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.productCategoryName}">类别</option>
    </select>
  </div>

  <div style="margin-top:12px;">
    <button type="submit">保存</button>
  </div>
</form>
</body>
</html>
