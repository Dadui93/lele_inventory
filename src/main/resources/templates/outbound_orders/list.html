<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>出库单</title>
  <link rel="stylesheet" th:href="@{/style.css}"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container" style="max-width:1100px;">
  <div class="nav">
    <a th:href="@{/}">主页</a>
    <button class="btn btn-primary btn-sm" type="button" data-bs-toggle="collapse" data-bs-target="#createOutbound">
      新增出库单
    </button>
  </div>

  <div class="d-flex align-items-center justify-content-between mt-2">
    <h2 class="mb-0">出库单列表</h2>
    <span class="text-muted" th:text="'共 ' + ${#lists.size(orders)} + ' 条'">共 0 条</span>
  </div>

  <div id="createOutbound" class="collapse mt-3 show">
    <div class="card">
      <div class="card-header">
        新增出库单（从 IN_TRANSITION 流转到 OUTBOUND）
      </div>
      <div class="card-body">
        <form th:action="@{/outbound-orders}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">出库单号（outbound_order_id）</label>
              <input type="text" class="form-control" name="outboundOrderId" required/>
            </div>
            <div class="col-md-6">
              <label class="form-label">客户（buyer）</label>
              <select class="form-select" name="buyerId" required>
                <option th:each="b : ${buyers}" th:value="${b.id}" th:text="${b.buyerName + ' / ' + b.buyingPlatform.buyPlatformName}">buyer</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">是否到仓（is_arrived）</label>
              <div class="form-check mt-2">
                <input class="form-check-input" type="checkbox" name="isArrived" value="true" id="outboundArrived"/>
                <label class="form-check-label" for="outboundArrived">是</label>
              </div>
            </div>
          </div>

          <div class="mt-3">
            <label class="form-label">备注（note）</label>
            <textarea name="note" rows="3" class="form-control"></textarea>
          </div>

          <h5 class="mt-4">选择要出库的 item（当前必须是 IN_TRANSITION）</h5>
          <div class="table-responsive">
            <table class="table table-bordered align-middle">
              <thead class="table-light">
              <tr>
                <th style="width:80px;">选择</th>
                <th>转运单</th>
                <th>入库单</th>
                <th>品类 / 商品</th>
                <th>官方挂牌价</th>
                <th>实际成本</th>
                <th>渠道成交价</th>
                <th>实际卖出价</th>
              </tr>
              </thead>
              <tbody>
              <tr th:each="it : ${eligibleItems}">
                <td>
                  <input type="checkbox" name="itemIds" th:value="${it.id}"/>
                </td>
                <td th:text="${it.transitionShipment.shipmentId}">S001</td>
                <td th:text="${it.inboundOrder.inboundOrderId}">IN001</td>
                <td th:text="${it.product.productCategory.productCategoryName + ' / ' + it.product.productName}">cat / name</td>
                <td th:text="${it.officialListingPrice}">0</td>
                <td th:text="${it.actualCost}">0</td>
                <td th:text="${it.itemSellingPrice}">0</td>
                <td th:text="${it.itemActualSellingPrice}">0</td>
              </tr>
              <tr th:if="${#lists.isEmpty(eligibleItems)}">
                <td colspan="8">暂无 IN_TRANSITION item</td>
              </tr>
              </tbody>
            </table>
          </div>

          <div class="mt-3">
            <button type="submit" class="btn btn-success">保存出库单</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="mt-4">
    <div class="table-responsive">
      <table class="table table-striped table-bordered align-middle">
        <thead class="table-light">
        <tr>
          <th>出库单号</th>
          <th>客户</th>
          <th>平台</th>
          <th>是否到仓</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="o : ${orders}">
          <td th:text="${o.outboundOrderId}">OUT001</td>
          <td th:text="${o.buyer.buyerName}">Tom</td>
          <td th:text="${o.buyer.buyingPlatform.buyPlatformName}">Amazon</td>
          <td th:text="${o.arrived}">false</td>
        </tr>
        <tr th:if="${#lists.isEmpty(orders)}">
          <td colspan="4">暂无数据</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>
</body>
</html>
