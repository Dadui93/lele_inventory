<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>New Outbound Order</title>
  <link rel="stylesheet" th:href="@{/style.css}"/>
</head>
<body>
<div class="nav">
  <a th:href="@{/}">主页</a>
  <a th:href="@{/outbound-orders}">返回列表</a>
</div>

<h2>新增出库单（从 IN_TRANSITION 流转到 OUTBOUND）</h2>

<form th:action="@{/outbound-orders}" method="post">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

  <h3 style="margin-top:18px;">出库信息</h3>
  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
    <div>
      <label>出库单号（outbound_order_id）</label><br/>
      <input type="text" name="outboundOrderId" required/>
    </div>
    <div>
      <label>客户（buyer）</label><br/>
      <select name="buyerId" required>
        <option th:each="b : ${buyers}" th:value="${b.id}" th:text="${b.buyerName + ' / ' + b.buyingPlatform.buyPlatformName}">buyer</option>
      </select>
    </div>
    <div>
      <label>是否到仓（is_arrived）</label><br/>
      <input type="checkbox" name="isArrived" value="true"/>
    </div>
  </div>

  <div style="margin-top:12px;">
    <label>备注（note）</label><br/>
    <textarea name="note" rows="3" style="width:100%;"></textarea>
  </div>

  <h3 style="margin-top:18px;">选择要出库的 item（当前必须是 IN_TRANSITION）</h3>
  <table>
    <thead>
    <tr>
      <th>选择</th>
      <th>转运单</th>
      <th>入库单</th>
      <th>品类 / 商品</th>
      <th>官方挂牌价</th>
      <th>实际成本</th>
      <th>渠道成交价</th>
      <th>实际卖出价</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="it : ${eligibleItems}">
      <td>
        <input type="checkbox" name="itemIds" th:value="${it.id}" />
      </td>
      <td th:text="${it.transitionShipment.shipmentId}">S001</td>
      <td th:text="${it.inboundOrder.inboundOrderId}">IN001</td>
      <td th:text="${it.product.productCategory.productCategoryName + ' / ' + it.product.productName}">cat / name</td>
      <td th:text="${it.officialListingPrice}">0</td>
      <td th:text="${it.actualCost}">0</td>
      <td th:text="${it.itemSellingPrice}">0</td>
      <td th:text="${it.itemActualSellingPrice}">0</td>
    </tr>
    <tr th:if="${#lists.isEmpty(eligibleItems)}">
      <td colspan="8">暂无 IN_TRANSITION item</td>
    </tr>
    </tbody>
  </table>

  <div style="margin-top:16px;">
    <button type="submit">保存出库单</button>
  </div>
</form>
</body>
</html>
