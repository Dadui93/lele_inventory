<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>New Buying Platform</title>
  <link rel="stylesheet" th:href="@{/style.css}"/>
</head>
<body>
<div class="nav">
  <a th:href="@{/}">主页</a>
  <a th:href="@{/buying-platforms}">返回列表</a>
</div>

<h2>新增购买平台</h2>
<form th:action="@{/buying-platforms}" method="post">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

  <div>
    <label>平台编码：</label>
    <input type="text" name="buyingPlatformId" required/>
  </div>
  <div style="margin-top:10px;">
    <label>平台名称：</label>
    <input type="text" name="buyPlatformName" required/>
  </div>

  <div style="margin-top:12px;">
    <button type="submit">保存</button>
  </div>
</form>
</body>
</html>
