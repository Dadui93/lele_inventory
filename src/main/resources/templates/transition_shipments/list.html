<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>转运单</title>
  <link rel="stylesheet" th:href="@{/style.css}"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container" style="max-width:1100px;">
  <div class="nav">
    <a th:href="@{/}">主页</a>
    <button class="btn btn-primary btn-sm" type="button" data-bs-toggle="collapse" data-bs-target="#createTransition">
      新增转运单
    </button>
  </div>

  <div class="d-flex align-items-center justify-content-between mt-2">
    <h2 class="mb-0">转运单列表</h2>
    <span class="text-muted" th:text="'共 ' + ${#lists.size(shipments)} + ' 条'">共 0 条</span>
  </div>

  <div id="createTransition" class="collapse mt-3 show">
    <div class="card">
      <div class="card-header">
        新增转运单（从 INBOUND 流转到 IN_TRANSITION）
      </div>
      <div class="card-body">
        <form th:action="@{/transition-shipments}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">转运单号（shipment_id）</label>
              <input type="text" class="form-control" name="shipmentId" required/>
            </div>
            <div class="col-md-6">
              <label class="form-label">追踪号（transition_tracking_no）</label>
              <input type="text" class="form-control" name="transitionTrackingNo"/>
            </div>
            <div class="col-md-6">
              <label class="form-label">承运商（carrier）</label>
              <input type="text" class="form-control" name="carrier"/>
            </div>
            <div class="col-md-6">
              <label class="form-label">运费（shipping_cost）</label>
              <input type="number" step="0.01" class="form-control" name="shippingCost"/>
            </div>
            <div class="col-md-6">
              <label class="form-label">是否到仓（is_arrived）</label>
              <div class="form-check mt-2">
                <input class="form-check-input" type="checkbox" name="isArrived" value="true" id="transitionArrived"/>
                <label class="form-check-label" for="transitionArrived">是</label>
              </div>
            </div>
          </div>

          <div class="mt-3">
            <label class="form-label">备注（note）</label>
            <textarea name="note" rows="3" class="form-control"></textarea>
          </div>

          <h5 class="mt-4">选择要转运的 item（当前必须是 INBOUND）</h5>
          <div class="table-responsive">
            <table class="table table-bordered align-middle">
              <thead class="table-light">
              <tr>
                <th style="width:80px;">选择</th>
                <th>入库单</th>
                <th>品类 / 商品</th>
                <th>官方挂牌价</th>
                <th>实际成本</th>
                <th>渠道成交价</th>
                <th>实际卖出价</th>
              </tr>
              </thead>
              <tbody>
              <tr th:each="it : ${eligibleItems}">
                <td>
                  <input type="checkbox" name="itemIds" th:value="${it.id}"/>
                </td>
                <td th:text="${it.inboundOrder.inboundOrderId}">IN001</td>
                <td th:text="${it.product.productCategory.productCategoryName + ' / ' + it.product.productName}">cat / name</td>
                <td th:text="${it.officialListingPrice}">0</td>
                <td th:text="${it.actualCost}">0</td>
                <td th:text="${it.itemSellingPrice}">0</td>
                <td th:text="${it.itemActualSellingPrice}">0</td>
              </tr>
              <tr th:if="${#lists.isEmpty(eligibleItems)}">
                <td colspan="7">暂无 INBOUND item</td>
              </tr>
              </tbody>
            </table>
          </div>

          <div class="mt-3">
            <button type="submit" class="btn btn-success">保存转运单</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="mt-4">
    <div class="table-responsive">
      <table class="table table-striped table-bordered align-middle">
        <thead class="table-light">
        <tr>
          <th>转运单号</th>
          <th>追踪号</th>
          <th>承运商</th>
          <th>运费</th>
          <th>是否到仓</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${shipments}">
          <td th:text="${s.shipmentId}">S001</td>
          <td th:text="${s.transitionTrackingNo}">TRK</td>
          <td th:text="${s.carrier}">DHL</td>
          <td th:text="${s.shippingCost}">0.00</td>
          <td th:text="${s.arrived}">false</td>
        </tr>
        <tr th:if="${#lists.isEmpty(shipments)}">
          <td colspan="5">暂无数据</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>
</body>
</html>
