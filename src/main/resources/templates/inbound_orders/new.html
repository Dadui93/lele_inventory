<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>New Inbound Order</title>
  <link rel="stylesheet" th:href="@{/style.css}"/>
</head>
<body>
<div class="nav">
  <a th:href="@{/}">主页</a>
  <a th:href="@{/inbound-orders}">返回列表</a>
</div>

<h2>新增入库单（并录入 item）</h2>

<form th:action="@{/inbound-orders}" method="post" id="inboundForm">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

  <h3 style="margin-top:18px;">入库信息</h3>
  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
    <div>
      <label>入库单号（inbound_order_id）</label><br/>
      <input type="text" name="inboundOrderId" required/>
    </div>
    <div>
      <label>日期（inbound_order_date）</label><br/>
      <input type="date" name="inboundOrderDate" required/>
    </div>
    <div>
      <label>追踪号（inbound_tracking_no）</label><br/>
      <input type="text" name="inboundTrackingNo"/>
    </div>
    <div>
      <label>承运商（inbound_ship_carrier）</label><br/>
      <input type="text" name="inboundShipCarrier"/>
    </div>
    <div>
      <label>来源（inbound_source_name）</label><br/>
      <input type="text" name="inboundSourceName"/>
    </div>
    <div>
      <label>是否到仓（is_arrived）</label><br/>
      <input type="checkbox" name="isArrived" value="true"/>
    </div>
  </div>

  <div style="margin-top:12px;">
    <label>备注（note）</label><br/>
    <textarea name="note" rows="3" style="width:100%;"></textarea>
  </div>

  <h3 style="margin-top:18px;">item 明细（每一行就是一条 item 记录）</h3>
  <table>
    <thead>
    <tr>
      <th>商品</th>
      <th>官方挂牌价</th>
      <th>实际成本</th>
      <th>渠道成交价</th>
      <th>实际卖出价</th>
      <th>行备注</th>
      <th>操作</th>
    </tr>
    </thead>
    <tbody id="itemsTbody">
    <tr>
      <td>
        <select name="itemProductId" required>
          <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.productCategory.productCategoryName + ' / ' + p.productName}">P</option>
        </select>
      </td>
      <td><input type="number" step="0.01" name="officialListingPrice" required/></td>
      <td><input type="number" step="0.01" name="actualCost" required/></td>
      <td><input type="number" step="0.01" name="itemSellingPrice" required/></td>
      <td><input type="number" step="0.01" name="itemActualSellingPrice" required/></td>
      <td><input type="text" name="itemNote"/></td>
      <td>
        <button type="button" onclick="addRow()">+行</button>
      </td>
    </tr>
    </tbody>
  </table>

  <div style="margin-top:16px;">
    <button type="submit">保存入库单</button>
  </div>
</form>

<template id="itemRowTemplate">
  <tr>
    <td>
      <select name="itemProductId" required>
        <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.productCategory.productCategoryName + ' / ' + p.productName}">P</option>
      </select>
    </td>
    <td><input type="number" step="0.01" name="officialListingPrice" required/></td>
    <td><input type="number" step="0.01" name="actualCost" required/></td>
    <td><input type="number" step="0.01" name="itemSellingPrice" required/></td>
    <td><input type="number" step="0.01" name="itemActualSellingPrice" required/></td>
    <td><input type="text" name="itemNote"/></td>
    <td>
      <button type="button" onclick="removeRow(this)">-</button>
    </td>
  </tr>
</template>

<script th:inline="javascript">
  function addRow() {
    const tbody = document.getElementById('itemsTbody');
    const tpl = document.getElementById('itemRowTemplate');
    tbody.appendChild(tpl.content.cloneNode(true));
  }

  function removeRow(btn) {
    const tr = btn.closest('tr');
    tr.remove();
  }
</script>
</body>
</html>
