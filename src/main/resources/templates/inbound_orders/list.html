<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>入库单</title>
  <link rel="stylesheet" th:href="@{/style.css}"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container" style="max-width:1100px;">
  <div class="nav">
    <a th:href="@{/}">主页</a>
    <button class="btn btn-primary btn-sm" type="button" data-bs-toggle="collapse" data-bs-target="#createInbound">
      新增入库单
    </button>
  </div>

  <div class="d-flex align-items-center justify-content-between mt-2">
    <h2 class="mb-0">入库单列表</h2>
    <span class="text-muted" th:text="'共 ' + ${#lists.size(orders)} + ' 条'">共 0 条</span>
  </div>

  <div id="createInbound" class="collapse mt-3 show">
    <div class="card">
      <div class="card-header">
        新增入库单（并录入 item）
      </div>
      <div class="card-body">
        <form th:action="@{/inbound-orders}" method="post" id="inboundForm">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">入库单号（inbound_order_id）</label>
              <input type="text" class="form-control" name="inboundOrderId" required/>
            </div>
            <div class="col-md-6">
              <label class="form-label">日期（inbound_order_date）</label>
              <input type="date" class="form-control" name="inboundOrderDate" required/>
            </div>
            <div class="col-md-6">
              <label class="form-label">追踪号（inbound_tracking_no）</label>
              <input type="text" class="form-control" name="inboundTrackingNo"/>
            </div>
            <div class="col-md-6">
              <label class="form-label">承运商（inbound_ship_carrier）</label>
              <input type="text" class="form-control" name="inboundShipCarrier"/>
            </div>
            <div class="col-md-6">
              <label class="form-label">来源（inbound_source_name）</label>
              <input type="text" class="form-control" name="inboundSourceName"/>
            </div>
            <div class="col-md-6">
              <label class="form-label">是否到仓（is_arrived）</label>
              <div class="form-check mt-2">
                <input class="form-check-input" type="checkbox" name="isArrived" value="true" id="isArrived"/>
                <label class="form-check-label" for="isArrived">是</label>
              </div>
            </div>
          </div>

          <div class="mt-3">
            <label class="form-label">备注（note）</label>
            <textarea name="note" rows="3" class="form-control"></textarea>
          </div>

          <h5 class="mt-4">item 明细（每一行就是一条 item 记录）</h5>
          <div class="table-responsive">
            <table class="table table-bordered align-middle">
              <thead class="table-light">
              <tr>
                <th style="min-width:260px;">商品</th>
                <th style="min-width:120px;">官方挂牌价</th>
                <th style="min-width:120px;">实际成本</th>
                <th style="min-width:120px;">渠道成交价</th>
                <th style="min-width:140px;">实际卖出价</th>
                <th style="min-width:180px;">行备注</th>
                <th style="min-width:90px;">操作</th>
              </tr>
              </thead>
              <tbody id="itemsTbody">
              <tr>
                <td>
                  <select class="form-select" name="itemProductId" required>
                    <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.productCategory.productCategoryName + ' / ' + p.productName}">P</option>
                  </select>
                </td>
                <td><input type="number" step="0.01" class="form-control" name="officialListingPrice" required/></td>
                <td><input type="number" step="0.01" class="form-control" name="actualCost" required/></td>
                <td><input type="number" step="0.01" class="form-control" name="itemSellingPrice" required/></td>
                <td><input type="number" step="0.01" class="form-control" name="itemActualSellingPrice" required/></td>
                <td><input type="text" class="form-control" name="itemNote"/></td>
                <td>
                  <button type="button" class="btn btn-outline-primary btn-sm" onclick="addRow()">+行</button>
                </td>
              </tr>
              </tbody>
            </table>
          </div>

          <div class="mt-3">
            <button type="submit" class="btn btn-success">保存入库单</button>
          </div>
        </form>

        <template id="itemRowTemplate">
          <tr>
            <td>
              <select class="form-select" name="itemProductId" required>
                <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.productCategory.productCategoryName + ' / ' + p.productName}">P</option>
              </select>
            </td>
            <td><input type="number" step="0.01" class="form-control" name="officialListingPrice" required/></td>
            <td><input type="number" step="0.01" class="form-control" name="actualCost" required/></td>
            <td><input type="number" step="0.01" class="form-control" name="itemSellingPrice" required/></td>
            <td><input type="number" step="0.01" class="form-control" name="itemActualSellingPrice" required/></td>
            <td><input type="text" class="form-control" name="itemNote"/></td>
            <td>
              <button type="button" class="btn btn-outline-danger btn-sm" onclick="removeRow(this)">-</button>
            </td>
          </tr>
        </template>

        <script th:inline="javascript">
          function addRow() {
            const tbody = document.getElementById('itemsTbody');
            const tpl = document.getElementById('itemRowTemplate');
            tbody.appendChild(tpl.content.cloneNode(true));
          }

          function removeRow(btn) {
            const tr = btn.closest('tr');
            tr.remove();
          }
        </script>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>
</body>
</html>
